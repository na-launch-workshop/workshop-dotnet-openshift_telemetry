apiVersion: batch/v1
kind: CronJob
metadata:
  name: opentelemetry-dotnet-curl
spec:
  # Runs every minute (adjust to "*/1 * * * *")
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: opentelemetry-dotnet-curl-random
            env:
              - name: ENDPOINT
                ### REPLACE THIS VALUE WITH YOUR UNIQUE SERVICE NAME i.e. workshop-<your username> ###
                value: <REPLACEME>:5000
            image: image-registry.openshift-image-registry.svc:5000/workspace-images/opentelemetry-curl:latest
            # Optional: if your script requires no parameters,
            # you can rely on the CMD set in the image.
            # Otherwise, you can override with:
            # command: ["/bin/bash", "/opt/curl-cron.sh"]
          restartPolicy: OnFailure
